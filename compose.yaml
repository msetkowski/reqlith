# Local development environment.
#   docker compose up -d                  -> MSSQL + Keycloak (run the app from the IDE / mvnd)
#   docker compose --profile full up -d   -> also builds and runs the app container
# Podman without compose: scripts/podman-dev.sh up
name: reqlith

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Reqlith_dev_SA_1}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'select 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Reqlith_dev_SA_1}
      APP_PASSWORD: ${REQLITH_DB_PASSWORD:-Reqlith_dev_app_1}
      MCP_PASSWORD: ${REQLITH_MCP_DB_PASSWORD:-Reqlith_dev_mcp_1}
    volumes:
      - ./dev/mssql/init.sql:/init.sql:ro,z
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -b -i /init.sql
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./dev/keycloak/reqlith-realm.json:/opt/keycloak/data/import/reqlith-realm.json:ro,z

  app:
    profiles: ["full"]
    build: .
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    environment:
      REQLITH_DB_URL: jdbc:sqlserver://mssql:1433;databaseName=reqlith;encrypt=true;trustServerCertificate=true
      REQLITH_DB_PASSWORD: ${REQLITH_DB_PASSWORD:-Reqlith_dev_app_1}
      REQLITH_MCP_DB_PASSWORD: ${REQLITH_MCP_DB_PASSWORD:-Reqlith_dev_mcp_1}
      REQLITH_IDP_ISSUER: http://localhost:8180/realms/reqlith
      REQLITH_IDP_INTERNAL_URL: http://keycloak:8080/realms/reqlith
    ports:
      - "8080:8080"

volumes:
  mssql-data:
