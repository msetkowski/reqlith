<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${title}">PRD</title>
    <style th:utext="${fonts}"></style>
    <style>
        @page { size: A4; }
        body { margin: 0; font-family: "IBM Plex Sans", sans-serif; font-size: 10.5pt; line-height: 1.5; color: #15171C; }
        h1 { font-size: 22pt; margin: 0 0 8pt; }
        h2 { font-size: 15pt; margin: 22pt 0 8pt; padding-bottom: 4pt; border-bottom: 1px solid #E2E4E9; break-after: avoid; }
        h3 { font-size: 12pt; margin: 16pt 0 6pt; break-after: avoid; }
        h4, h5, h6 { font-size: 10.5pt; margin: 12pt 0 4pt; break-after: avoid; }
        p, ul, ol, table, pre, blockquote { margin: 0 0 8pt; }
        ul, ol { padding-left: 18pt; }
        table { border-collapse: collapse; width: 100%; break-inside: avoid; }
        th, td { border: 1px solid #D3D6DE; padding: 4pt 6pt; text-align: left; vertical-align: top; }
        th { background: #F4F5F7; }
        code { font-family: "IBM Plex Mono", monospace; font-size: 9pt; background: #F4F5F7; padding: 0 2pt; border-radius: 2pt; }
        pre { background: #F4F5F7; padding: 8pt; border-radius: 4pt; white-space: pre-wrap; }
        pre code { background: none; padding: 0; }
        pre.mermaid { background: none; text-align: center; break-inside: avoid; }
        blockquote { border-left: 3px solid #D3D6DE; padding-left: 8pt; color: #5B6170; }
        a { color: #1F37A3; text-decoration: none; }
        .draft-mark { position: fixed; top: 40%; left: 0; right: 0; text-align: center; font-size: 96pt; font-weight: 600;
                      color: rgba(161, 40, 31, .08); transform: rotate(-30deg); z-index: -1; }
    </style>
</head>
<body>
<div class="draft-mark" th:if="${draft}">DRAFT</div>
<main th:utext="${body}"></main>
<!--/* mermaid.min.js is uploaded next to this page by the renderer; the renderer waits for mermaidDone. */-->
<script th:if="${mermaid}" src="mermaid.min.js"></script>
<script>
    (function () {
        if (!window.mermaid) { window.mermaidDone = true; return; }
        mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "neutral",
                             fontFamily: "IBM Plex Sans, sans-serif", flowchart: { htmlLabels: false } });
        mermaid.run({ querySelector: "pre.mermaid", suppressErrors: true })
            .finally(function () { window.mermaidDone = true; });
    })();
</script>
</body>
</html>
