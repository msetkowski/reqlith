<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Roles</title>
</head>
<body>
<nav layout:fragment="crumbs" class="crumbs" aria-label="Breadcrumb">
    <a th:href="@{/}">Projects</a><span aria-hidden="true">/</span><span class="current">Roles</span>
</nav>
<main class="page narrow" layout:fragment="content">
    <section class="title stack tight">
        <h1>Roles</h1>
        <p class="muted">Groups of users shared across projects. Each project describes what a role does in its own context.</p>
    </section>
    <section class="card">
        <div class="empty" th:if="${roles.isEmpty()}">No roles yet. Add them from a project's Roles section.</div>
        <div class="table-wrap" th:unless="${roles.isEmpty()}">
            <table class="data">
                <thead><tr><th>ID</th><th>Name</th><th>Used in projects</th><th>Modified</th></tr></thead>
                <tbody>
                <tr th:each="r : ${roles}">
                    <td class="mono muted" th:text="${r.key}">RO-01</td>
                    <td><a th:href="@{/roles/{rk}(rk=${r.key})}" style="font-weight: 500; text-decoration: none" th:text="${r.name}">Role</a></td>
                    <td th:text="${usage[r.id] ?: 0}">0</td>
                    <td class="muted" th:text="${@formats.date(r.updatedAt)}">date</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
