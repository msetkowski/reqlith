<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${project.title}">Project</title>
    <script th:src="@{/vendor/mermaid.min.js}" defer></script>
</head>
<body>
<nav layout:fragment="crumbs" class="crumbs" aria-label="Breadcrumb">
    <th:block th:replace="~{fragments/project :: crumbs('Document')}"></th:block>
</nav>
<div class="workbench" layout:fragment="content">
    <aside th:replace="~{fragments/project :: sidenav}"></aside>
    <main class="content" style="max-width: 980px">
        <section th:replace="~{fragments/project :: head}"></section>
        <div class="banner info">Working copy (draft). It becomes a fixed version once it is reviewed and approved.</div>

        <section class="doc-section" id="basic-information">
            <div class="row" style="justify-content: space-between">
                <h2 style="font-size: 20px">Basic information</h2>
                <a class="btn sm" th:if="${canEdit}" th:href="@{/p/{k}/basic-info/edit(k=${project.key})}">Edit</a>
            </div>
            <div class="card card-pad md" th:utext="${html.basicInfo}">basic info</div>
        </section>

        <th:block th:each="t : ${types}">
            <th:block th:if="${t.name() == 'SC'}">
            <section class="doc-section" id="roles">
                <h2>Roles</h2>
                <p class="muted small" th:if="${document.roles.isEmpty()}">None.</p>
                <article class="card doc-element" th:each="r : ${document.roles}" th:id="${r.key}">
                    <header>
                        <span class="key" th:text="${r.key}">RO-01</span>
                        <h3 th:text="${r.name}">Role</h3>
                    </header>
                    <div class="md" th:utext="${html.roles[r.key].first}">global</div>
                    <div class="traces">
                        <div class="label" style="margin-bottom: 4px">In this project</div>
                        <div class="md" th:utext="${html.roles[r.key].second}">context</div>
                    </div>
                </article>
            </section>
            </th:block>
            <section class="doc-section" th:id="${t.name()}" th:with="items=${document.elementsOf(t)}">
                <h2 th:text="${t.section}">Section</h2>
                <p class="muted small" th:if="${items.isEmpty()}">None.</p>
                <article class="card doc-element" th:each="e : ${items}" th:id="${e.key}">
                    <header>
                        <span class="key" th:text="${e.key}">FR-01</span>
                        <h3><a th:href="@{/p/{k}/e/{ek}(k=${project.key},ek=${e.key})}" style="color: inherit; text-decoration: none" th:text="${e.title}">Title</a></h3>
                        <span class="badge" th:if="${e.priority != null}" th:text="${e.priority.label}">Must</span>
                        <span class="tag" th:each="tag : ${e.tags}" th:text="|#${tag}|">#tag</span>
                    </header>
                    <div class="md" th:utext="${html.elements[e.key]}">body</div>
                    <div class="traces link-list" th:if="${!e.links.isEmpty() or incoming[e.key] != null}">
                        <div th:each="l : ${e.links}">
                            <span class="kind" th:text="${l.kind.label}">Derived from</span>
                            <a class="mono" th:href="|#${l.toKey}|" th:text="${l.toKey}">SR-01</a>
                        </div>
                        <div th:each="in : ${incoming[e.key]}">
                            <span class="kind" th:text="${in.first.kind.inverseLabel}">Refined by</span>
                            <a class="mono" th:href="|#${in.second}|" th:text="${in.second}">FR-01</a>
                        </div>
                    </div>
                </article>
            </section>
        </th:block>

    </main>
</div>
</body>
</html>
