# Tests: SQL Server and the PDF renderer come from Testcontainers (MsSqlContainerConfig overrides these values);
# the identity provider is never contacted.
spring:
  datasource:
    url: jdbc:sqlserver://provided-by-testcontainers
    password: provided-by-testcontainers
  security:
    oauth2:
      client:
        registration:
          idp:
            client-secret: test-secret
reqlith:
  base-url: http://localhost:8080
  mcp:
    datasource:
      password: provided-by-testcontainers
  pdf:
    url: http://provided-by-testcontainers
  idp:
    issuer: http://idp.test/realms/reqlith
management:
  server:
    # Random management port for tests that start a real server (see ActuatorIT).
    port: 0
