# CodeQL code scanning (advanced setup, replaces GitHub's default setup). Kotlin can only be analysed from a
# traced compilation, so the java-kotlin analysis builds the sources; the other languages need no build.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile main and test sources
        if: matrix.build-mode == 'manual'
        run: ./mvnw -B -ntp -DskipTests -Djacoco.skip=true test-compile

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
